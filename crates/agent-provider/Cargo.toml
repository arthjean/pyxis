[package]
name = "agent-provider"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# Implements the `Provider` trait of the core (agent-core): `OpenAiChatGpt` adapter
# (Responses API on the ChatGPT backend, stateless SSE, ADR-10). Auth delegated to
# `agent-auth`. No TUI dependency. Networking through reqwest + eventsource-stream
# (PROVIDERS 1.1, without an SDK).
[dependencies]
agent-core.workspace = true
agent-auth.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
async-stream.workspace = true
futures-util.workspace = true
tokio.workspace = true
reqwest = { workspace = true, features = ["stream"] }
eventsource-stream.workspace = true
thiserror.workspace = true
# US-029: generation of the session_id (UUID v4) for prompt_cache_key. `rand` is
# already pinned at the workspace level (agent-auth) -> no new crate downloaded.
rand.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
