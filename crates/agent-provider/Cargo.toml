[package]
name = "agent-provider"
description = "The `Provider` trait and its adapters, normalizing heterogeneous wire formats into one canonical `StreamEvent`."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# Implements the `Provider` trait of the core (agent-core): `OpenAiChatGpt` adapter
# (Responses API on the ChatGPT backend, WebSocket with HTTP/SSE fallback,
# ADR-10). Auth delegated to `agent-auth`. No TUI dependency. Networking through
# reqwest + eventsource-stream + tokio-tungstenite (PROVIDERS 1.1, without an SDK).
[dependencies]
agent-core.workspace = true
agent-auth.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
async-stream.workspace = true
futures-util.workspace = true
tokio.workspace = true
tokio-util.workspace = true
reqwest = { workspace = true, features = ["multipart", "stream"] }
eventsource-stream.workspace = true
tokio-tungstenite = { workspace = true, features = ["connect", "rustls-tls-webpki-roots"] }
thiserror.workspace = true
# US-029: generation of the session_id (UUID v4) for prompt_cache_key. `rand` is
# already pinned at the workspace level (agent-auth) -> no new crate downloaded.
rand.workspace = true
base64.workspace = true
hex.workspace = true
sha2.workspace = true
tracing.workspace = true
url.workspace = true
zstd.workspace = true
aws-config.workspace = true
aws-credential-types.workspace = true
aws-sdk-bedrockruntime.workspace = true
aws-smithy-runtime-api.workspace = true
aws-smithy-types.workspace = true
aws-types.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util"] }
