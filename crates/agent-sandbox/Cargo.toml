[package]
name = "agent-sandbox"
description = "Execution sandbox: Landlock filesystem confinement and the local network allow-list proxy."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# Execution sandbox (US-020): kernel-level FS confinement (Landlock) + allow-list
# network proxy. Linux-first; explicit degradation elsewhere (AC3).
[dependencies]
# The confinement POLICY is pure data owned by `agent-core` (ADR-3): this crate
# applies it, `agent-tools` evaluates it. Neither one owns it.
agent-core.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "process", "rt", "time"] }
thiserror.workspace = true
# US-004: the network approver is consulted from inside the proxy, hence behind
# an `Arc<dyn ...>`. Already in the workspace graph, no new dependency.
async-trait.workspace = true

# Landlock = Linux only. Outside Linux, the FS sandbox degrades to disabled.
[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true

[dev-dependencies]
# `test-util` drives the virtual clock: the approval bound is asserted without
# a real 60-second wait.
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "test-util"] }
