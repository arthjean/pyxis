[package]
name = "agent-sandbox"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# Execution sandbox (US-020): kernel-level FS confinement (Landlock) + allow-list
# network proxy. Linux-first; explicit degradation elsewhere (AC3).
[dependencies]
# The confinement POLICY is pure data owned by `agent-core` (ADR-3): this crate
# applies it, `agent-tools` evaluates it. Neither one owns it.
agent-core.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "process", "rt"] }
thiserror.workspace = true

# Landlock = Linux only. Outside Linux, the FS sandbox degrades to disabled.
[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
