[package]
name = "agent-runtime"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# Thread runtime (ADR-12): sits BETWEEN `agent-core` (turn engine) and the
# clients. It depends on the core for the canonical types (`Message`,
# `AgentEvent`, `Clock`, `Deps`) and NEVER the other way round. It touches no
# disk: the JSONL adapter of `ThreadStore` lives in `agent-session`, which
# depends on this crate.
[dependencies]
agent-core.workspace = true
async-trait.workspace = true
futures-util.workspace = true
hex.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
agent-tokenizer.workspace = true
