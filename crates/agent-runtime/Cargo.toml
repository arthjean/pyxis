[package]
name = "agent-runtime"
description = "Durable thread runtime: turn lifecycle, bounded mailbox, steering, hierarchical cancellation, forks and the `ThreadStore` contract."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# Thread runtime (ADR-12): sits BETWEEN `agent-core` (turn engine) and the
# clients. It depends on the core for the canonical types (`Message`,
# `AgentEvent`, `Clock`, `Deps`) and NEVER the other way round. It touches no
# disk: the JSONL adapter of `ThreadStore` lives in `agent-session`, which
# depends on this crate.
[dependencies]
agent-core.workspace = true
async-trait.workspace = true
futures-util.workspace = true
hex.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
# EP-004: identifies a sub-agent diff without carrying it into the parent's
# context. Already in the workspace graph (agent-session), no new dependency.
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
agent-tokenizer.workspace = true
# Collects what the runtime emits through the facade, in-process, for the
# US-019 correlation test. Test-only: the binary stays the only crate that
# installs a subscriber for real (FR-15).
tracing-subscriber.workspace = true
