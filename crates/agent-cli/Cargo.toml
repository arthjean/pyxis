[package]
name = "agent-cli"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["codex_tui_parity"]
codex_tui_parity = ["agent-tui/codex_tui_parity"]

# Published `pyxis` binary (ADR-5/ADR-8). The ONLY crate that depends on everything: it wires
# the core, the provider, the tools, the session, the sandbox and the frontend.
[[bin]]
name = "pyxis"
path = "src/main.rs"

[dependencies]
agent-core.workspace = true
agent-runtime.workspace = true
# EP-005: the external client contract. The binary supplies its runtime host.
agent-app-server.workspace = true
agent-tokenizer.workspace = true
agent-session.workspace = true
agent-auth.workspace = true
agent-provider.workspace = true
agent-tools.workspace = true
# EP-002: the binary is the only place that knows Code Mode runs on V8.
agent-code-mode.workspace = true
agent-code-mode-v8.workspace = true
agent-sandbox.workspace = true
agent-mcp.workspace = true
agent-tui.workspace = true
tokio.workspace = true
tokio-util.workspace = true
crossterm.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
anyhow.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
