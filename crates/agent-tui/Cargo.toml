[package]
name = "agent-tui"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["codex_tui_parity"]
codex_tui_parity = []

# Terminal frontend (US-019). CLIENT of the core: consumes `agent_core::AgentEvent`,
# decides the rendering alone (never ANSI coming from the core). Ratatui + crossterm stack.
# Aesthetics: monochrome + one accent, spare (no heavy borders).
[dependencies]
agent-core.workspace = true
ratatui.workspace = true
crossterm.workspace = true
serde_json.workspace = true
pulldown-cmark.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
textwrap.workspace = true
similar.workspace = true
syntect.workspace = true
two-face.workspace = true

# US-005: terminal rendering snapshot harness. `insta` stays here, outside the
# production graph (`cargo tree -e normal` does not see it).
[dev-dependencies]
insta.workspace = true
