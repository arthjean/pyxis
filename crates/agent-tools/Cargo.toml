[package]
name = "agent-tools"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# `agent-tools` implements the `ToolDispatch` trait of the core (the only boundary,
# ARCHITECTURE 4): Registry, strict pipeline, permissions, taint. Depends
# on `agent-core` for the canonical types (ToolInvocation/ToolOutcome/ToolSpec).
[dependencies]
agent-core.workspace = true
# EP-002: the model-visible `exec`/`wait` pair. `agent-tools` owns the tool
# pipeline, so the two tools live here; the cell state machine stays in
# `agent-code-mode` and V8 stays out of this crate entirely.
agent-code-mode.workspace = true
# EP-004: the sub-agent tools are the model-facing surface of the runtime's
# agent graph. One-way dependency, like `agent-session` -> `agent-runtime`: the
# runtime never depends on the tools, which is what keeps its policy testable
# without a registry.
agent-runtime.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["process", "fs"] }
libc.workspace = true
thiserror.workspace = true
regex.workspace = true
globset.workspace = true
walkdir.workspace = true
# aggregated turn diff (US-018): diff engine already present in the workspace,
# used here to produce the unified text. No new dependency.
similar.workspace = true
# `view_image` (US-011): the provider wire format for an image block is base64.
# Already in the workspace graph (agent-auth), no new dependency.
base64.workspace = true
tracing.workspace = true

# EP-004/US-014: PTY sessions. Unix-only by construction (`openpty`), which is
# also the platform this version targets; the `tty: true` request is refused
# before spawn everywhere else.
[target.'cfg(unix)'.dependencies]
nix.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
# US-020: proves what the trace carries per level, without a real subscriber
# process-wide (the binary owns that install).
tracing-subscriber.workspace = true
