[package]
name = "agent-tools"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# `agent-tools` implements the `ToolDispatch` trait of the core (the only boundary,
# ARCHITECTURE 4): Registry, strict pipeline, permissions, taint. Depends
# on `agent-core` for the canonical types (ToolInvocation/ToolOutcome/ToolSpec).
[dependencies]
agent-core.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["process", "fs"] }
thiserror.workspace = true
regex.workspace = true
globset.workspace = true
walkdir.workspace = true
# aggregated turn diff (US-018): diff engine already present in the workspace,
# used here to produce the unified text. No new dependency.
similar.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread"] }
