[package]
name = "agent-session"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
agent-core.workspace = true
# EP-001: `agent-session` gains the LOCAL adapter of the orchestration store.
# The `ThreadStore` trait and the memory adapter stay in `agent-runtime`, which
# never touches the disk; the dependency therefore runs one way only.
agent-runtime.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true }
# EP-005 E2E: the full wiring (thread actor + real `run_agent` + JSONL store)
# can only be assembled where the JSONL adapter lives, so the fakes of the
# engine come here rather than the store going up into `agent-runtime`.
agent-tokenizer.workspace = true
async-trait.workspace = true
futures-util.workspace = true
tokio-util.workspace = true
