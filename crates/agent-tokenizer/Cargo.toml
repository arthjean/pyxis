[package]
name = "agent-tokenizer"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# Headless: no TUI/HTTP dependency (invariant 1). tiktoken-rs behind a
# feature to keep the build light; the heuristic is enough for the compaction threshold.
[features]
default = []
tiktoken = ["dep:tiktoken-rs"]

[dependencies]
tiktoken-rs = { version = "0.7", optional = true }
