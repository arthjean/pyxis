[package]
name = "agent-core"
description = "Agent loop, transition state machine and the canonical message, transcript and budget types, headless by construction."
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

# Invariant 1 (ARCHITECTURE 2): agent-core depends NEITHER on agent-tui NOR
# on agent-provider. The only allowed non-core dependency: agent-tokenizer
# (headless). The I/O (Provider, Session, Clock, Tools) are injected through traits.
[dependencies]
agent-tokenizer.workspace = true
# Tool output travels as RAW BYTES (a command may emit anything): base64 is how
# it survives a JSON event without the core deciding, on the client's behalf,
# what non-UTF-8 should look like.
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
async-trait.workspace = true
async-stream.workspace = true
futures-util.workspace = true
tokio.workspace = true
# US-008: `CancellationToken` is THE cancellation signal of the loop. The core
# holds a single tree with the runtime instead of translating between two
# mechanisms; no runtime supervision (`TaskTracker`) enters here.
tokio-util.workspace = true
thiserror.workspace = true
tracing.workspace = true
