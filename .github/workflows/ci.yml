# Continuous integration.
#
# A single platform: Linux. ADR-11 sets Linux as the only supported target,
# so no multi-OS matrix is declared.
#
# The three commands are the quality gates, from the cheapest
# to the most expensive. `clippy` runs WITHOUT `-D warnings`: the workspace declares
# `unwrap_used`/`expect_used` as `warn` by documented decision (`Cargo.toml`),
# and a global hardening would make the command red on healthy code.
name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The job only reads the repository: `checkout`, compilation, step summary.
# Without this key, the `GITHUB_TOKEN` inherits the repository default and the three
# third-party actions below (mutable tags, reassignable by their maintainer)
# run with that right. The project takes an explicit stand against that
# vector ("Configuration-Based Sandbox Escape").
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + tests
    runs-on: ubuntu-latest
    # Hard cap of AC2: past it, the job fails instead of drifting.
    #
    # 30 rather than 15 because the cap has to cover the run that fills the
    # cache, not only the runs that hit it. `clippy` leaves the dependency
    # graph at metadata only, so `cargo test` is the first command that
    # actually codegens and links the 54 test binaries, and on a cold cache
    # that is minutes on a four-core runner. A cap the priming run cannot
    # meet cancels the job, and a cancelled job archives NO log, which is how
    # this gate stayed undiagnosable.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      # `keyring` pulls `dbus-secret-service` -> `libdbus-sys`, which compiles against
      # the dbus headers. The runner image does not guarantee them.
      #
      # `mold`: `.cargo/config.toml` forces `-fuse-ld=mold` for the whole
      # workspace. Without it, the runner fails at link time from the build scripts on
      # (`collect2: cannot find 'ld'`). Installing the linker rather than
      # neutralizing the configuration keeps the CI faithful to the dev machine.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config mold

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Registry + `target/` cache: without it the suite recompiles the whole graph
      # on every push and the time budget does not hold.
      #
      # `cache-on-failure` is what makes that budget reachable at all. The
      # default saves only after a green job, so a workspace whose gate is red
      # never banks the graph it just compiled and every rerun starts cold:
      # the cheap gates keep failing on the expensive one's build. Saving on a
      # red run costs one cache write and makes each fix iteration pay for
      # compilation once.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      # `--no-fail-fast`: the summary must name ALL the failing tests, not
      # only the first crate that breaks.
      - name: Tests
        id: tests
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee cargo-test.log

      # AC3: a failure names the failing test in the workflow summary, not
      # only at the bottom of the log.
      - name: Report failing tests
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          failed=""
          if [ -f cargo-test.log ]; then
            failed=$(sed -n 's/^test \(.*\) \.\.\. FAILED$/- `\1`/p' cargo-test.log | sort -u) || failed=""
          fi
          {
            echo "## Failing tests"
            echo
            if [ -n "$failed" ]; then
              echo "$failed"
            else
              echo "No individual test was reported as FAILED; the suite failed to build or to link."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
