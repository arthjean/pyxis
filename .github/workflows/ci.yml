# Continuous integration.
#
# A single platform: Linux. ADR-11 sets Linux as the only supported target,
# so no multi-OS matrix is declared.
#
# The three commands are the quality gates, from the cheapest
# to the most expensive. `clippy` runs WITHOUT `-D warnings`: the workspace declares
# `unwrap_used`/`expect_used` as `warn` by documented decision (`Cargo.toml`),
# and a global hardening would make the command red on healthy code.
name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The job only reads the repository: `checkout`, compilation, step summary.
# Without this key, the `GITHUB_TOKEN` inherits the repository default and the three
# third-party actions below (mutable tags, reassignable by their maintainer)
# run with that right. The project takes an explicit stand against that
# vector ("Configuration-Based Sandbox Escape").
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + tests
    runs-on: ubuntu-latest
    # Hard cap of AC2: past it, the job fails instead of drifting.
    #
    # The cap has to cover the run that FILLS the cache, not only the runs
    # that hit it: `clippy` leaves the dependency graph at metadata only, so
    # `cargo test` is the first command that codegens and links the 54 test
    # binaries, and on a cold cache that is minutes on a four-core runner.
    #
    # This is the outer backstop only. It is deliberately looser than the
    # per-step `timeout` calls below, because reaching THIS one cancels the
    # job and a cancelled job archives no log: the steps must fail first, and
    # readably.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5

      # `keyring` pulls `dbus-secret-service` -> `libdbus-sys`, which compiles against
      # the dbus headers. The runner image does not guarantee them.
      #
      # `mold`: `.cargo/config.toml` forces `-fuse-ld=mold` for the whole
      # workspace. Without it, the runner fails at link time from the build scripts on
      # (`collect2: cannot find 'ld'`). Installing the linker rather than
      # neutralizing the configuration keeps the CI faithful to the dev machine.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config mold

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Registry + `target/` cache: without it the suite recompiles the whole graph
      # on every push and the time budget does not hold.
      #
      # `cache-on-failure` is what makes that budget reachable at all. The
      # default saves only after a green job, so a workspace whose gate is red
      # never banks the graph it just compiled and every rerun starts cold:
      # the cheap gates keep failing on the expensive one's build. Saving on a
      # red run costs one cache write and makes each fix iteration pay for
      # compilation once.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets

      # Compiling the tests is its OWN step, and not for tidiness: `clippy`
      # stops at metadata, so this is where the whole graph is codegened and
      # where 54 test binaries are linked. Merged into the run, a slow build
      # and a hung test are the same opaque stall.
      - name: Build tests
        run: timeout 25m cargo test --workspace --no-run

      # `--no-fail-fast`: the summary must name ALL the failing tests, not
      # only the first crate that breaks.
      #
      # `timeout` rather than the job-level cap alone: `timeout-minutes`
      # CANCELS the job, and a cancelled job archives no log, so a stall here
      # would erase the only evidence of itself. Failing from inside the step
      # keeps the log.
      #
      # `tee` keeps the run STREAMING into the live log. A stalled step that
      # writes to a file only is unreadable while it stalls and unreadable
      # after, once the job cap cancels it and the archive is dropped.
      #
      # What reaches the live log is FILTERED, and that is the point: the live
      # view renders at most a thousand lines, and a per-test log blows
      # through that long before the end. The filter keeps the binary headers,
      # the per-binary verdicts and every failure, so the last line of a
      # stalled run names what is stuck. `cargo-test.log` keeps the whole
      # thing for the summary below.
      #
      # `ps` on the way out names what is still alive, which is the one piece
      # of evidence the cargo log cannot carry: a test that never returns
      # never prints its result line, and a leaked grandchild never appears
      # in it at all.
      - name: Tests
        id: tests
        run: |
          set -o pipefail
          status=0
          timeout --kill-after=1m 10m \
            cargo test --workspace --no-fail-fast 2>&1 \
            | tee cargo-test.log \
            | grep --line-buffered -E '^(\s+Running|\s+Compiling|running [0-9]+ tests|test result:|test .+ (FAILED|ignored)|error|warning: unused|thread .+ panicked|---- )' \
            || status=$?
          echo "--- machine state at the stall ---"
          free -m
          df -h / /tmp
          echo "processes=$(ps -e --no-headers | wc -l) threads=$(ps -eLf --no-headers | wc -l)"
          ps -eo pid,ppid,etime,rss,args --sort=-rss | head -25
          exit "$status"

      # AC3: a failure names the failing test in the workflow summary, not
      # only at the bottom of the log.
      - name: Report failing tests
        if: failure() && steps.tests.outcome == 'failure'
        run: |
          failed=""
          if [ -f cargo-test.log ]; then
            failed=$(sed -n 's/^test \(.*\) \.\.\. FAILED$/- `\1`/p' cargo-test.log | sort -u) || failed=""
          fi
          {
            echo "## Failing tests"
            echo
            if [ -n "$failed" ]; then
              echo "$failed"
            else
              echo "No individual test was reported as FAILED; the suite failed to build or to link."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
