# THROWAWAY Phase 0 workspace (EP-001). These crates prove a hypothesis,
# not a finished feature: they will not survive as is into the MVP (see
# docs/ROADMAP.md "Phase 0", EP-001 DoD). The future MVP workspace will live at the
# root of the repo with `agent-*` crates; these spikes are prefixed `s*` and
# `canon` so that no MVP line can be confused with them.
[workspace]
resolver = "3"
members = [
    "s1-provider-access",
    "s2-canonical-sse",
    "s3-agent-loop",
    "s4-tui-stream",
    "s5-sandbox",
    "s6-code-mode-v8",
]

[workspace.package]
edition = "2024"
rust-version = "1.95"
publish = false

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
eventsource-stream = "0.2"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-stream = "0.3"
anyhow = "1"
ratatui = "0.29"
crossterm = "0.28"
landlock = "0.4"

# Mandatory clippy lints (global mandate). Throwaway does not mean sloppy:
# panic/unimplemented/dbg = deny; unwrap/expect = warn (not deny, see CLAUDE.md).
[workspace.lints.clippy]
panic = "deny"
unimplemented = "deny"
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
unwrap_in_result = "warn"
