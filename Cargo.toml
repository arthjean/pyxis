# Workspace MVP (Phase 1). Les spikes Phase 0 vivent dans `spikes/` (workspace
# séparé, jetable) et sont exclus ici. Crates internes nommées `agent-*` (ADR-8).
[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
publish = false
license = "GPL-3.0-or-later"

# Lints clippy obligatoires (mandat global). panic/unimplemented/dbg = deny ;
# unwrap/expect = warn (jamais deny, cf. CLAUDE.md / tokio #3887).
[workspace.lints.clippy]
panic = "deny"
unimplemented = "deny"
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
unwrap_in_result = "warn"

[workspace.dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.9"
base64 = "0.22"
hex = "0.4"
url = "2"
thiserror = "2"
keyring = { version = "3", features = [
    "apple-native",
    "sync-secret-service",
    "windows-native",
] }
open = "5"
async-trait = "0.1"
async-stream = "0.3"
futures-util = "0.3"
eventsource-stream = "0.2"
# outils FS (Glob/Grep) — standards, légers, déjà en cache registry.
regex = "1"
globset = "0.4"
walkdir = "2"
# frontend terminal (US-019) + sandbox (US-020). `unstable-rendered-line-info` :
# expose `Paragraph::line_count` pour borner le scroll au nombre de lignes APRÈS
# wrap (sinon impossible de remonter tout en haut quand des lignes wrappent).
ratatui = { version = "0.29", features = ["unstable-rendered-line-info"] }
crossterm = { version = "0.28", features = ["bracketed-paste"] }
# rendu markdown des réponses (CommonMark + GFM) → spans ratatui.
pulldown-cmark = { version = "0.12", default-features = false }
unicode-width = "0.2"
unicode-segmentation = "1"
# diff inline des éditions (EP-011) : lignes + emphase intra-ligne (word-diff). La
# feature `inline` expose `iter_inline_changes` ; `unicode` aligne la segmentation
# des mots sur les graphèmes.
similar = { version = "2", features = ["inline", "unicode"] }
# coloration syntaxique des code-blocks et diffs (EP-012, US-040/042). `default-fancy`
# = grammaires/thèmes Sublime embarqués via `fancy-regex` (PUR RUST, aucune toolchain
# C : pas d'oniguruma) → binaire distribuable. La coloration ne tourne JAMAIS par
# frame (cache US-041). `two-face` comble les grammaires manquantes de syntect (TS,
# TOML…) avec le set curé de `bat` ; `syntect-default-fancy` garde le backend fancy
# (onig hors du dependency tree, vérifié au `cargo tree`).
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }
landlock = "0.4"
anyhow = "1"
# snapshots de rendu terminal (US-005) : DEV-ONLY. Déclaré ici pour la version
# unique du workspace, mais réservé aux `[dev-dependencies]` — jamais dans le
# graphe du binaire `pyxis` distribué.
insta = "1"
# MCP (ARCHITECTURE §6) : SDK Rust officiel. Client stdio uniquement au départ
# (transport-child-process) ; SSE/HTTP + OAuth = Phase 2.
rmcp = { version = "1.7.0", default-features = false, features = ["client", "transport-child-process"] }
# crates internes
agent-tokenizer = { path = "crates/agent-tokenizer" }
agent-mcp = { path = "crates/agent-mcp" }
agent-core = { path = "crates/agent-core" }
agent-session = { path = "crates/agent-session" }
agent-tools = { path = "crates/agent-tools" }
agent-auth = { path = "crates/agent-auth" }
agent-provider = { path = "crates/agent-provider" }
agent-sandbox = { path = "crates/agent-sandbox" }
agent-tui = { path = "crates/agent-tui" }
