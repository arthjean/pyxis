# MVP workspace (Phase 1). The Phase 0 spikes live in `spikes/` (separate,
# throwaway workspace) and are excluded here. Internal crates named `agent-*` (ADR-8).
[workspace]
resolver = "3"
members = ["crates/*"]
default-members = ["crates/agent-cli"]
exclude = ["spikes"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
publish = false
license = "GPL-3.0-or-later"

# Mandatory clippy lints (global mandate). panic/unimplemented/dbg = deny;
# unwrap/expect = warn (never deny, see CLAUDE.md / tokio #3887).
[workspace.lints.clippy]
panic = "deny"
unimplemented = "deny"
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
unwrap_in_result = "warn"

[workspace.dependencies]
# `signal`: the headless client turns Ctrl+C into a runtime interruption
# (US-018 AC5) instead of letting the default handler kill the process in the
# middle of a durable write.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "macros", "sync", "signal"] }
# Thread runtime (EP-001): `CancellationToken` gives the PARENT->CHILD cancellation
# tree the in-house `CancelToken` cannot express, and `TaskTracker` (feature `rt`)
# accounts for dynamically spawned tasks so a shutdown can wait for them before
# aborting the stragglers. Already in the graph transitively (rmcp); promoted to a
# direct dependency instead of maintaining a second supervision mechanism.
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.9"
base64 = "0.22"
hex = "0.4"
url = "2"
thiserror = "2"
keyring = { version = "3", features = [
    "apple-native",
    "sync-secret-service",
    "windows-native",
] }
open = "5"
async-trait = "0.1"
async-stream = "0.3"
futures-util = "0.3"
eventsource-stream = "0.2"
# EP-004: `exec_command` allocates a PTY when the model asks for `tty: true`.
# Three syscalls need it and nothing else does: `openpty`, `setsid` (the child
# owns its session, so the group can be signalled without touching Pyxis) and
# `killpg`. The crate is ALREADY in the graph (keyring/secret-service), so this
# promotes a transitive dependency instead of adding one.
nix = { version = "0.31", features = ["term", "process", "fs", "signal"] }
# FS tools (Glob/Grep): standard, lightweight, already in the registry cache.
regex = "1"
globset = "0.4"
walkdir = "2"
# terminal frontend (US-019) + sandbox (US-020). `unstable-rendered-line-info`:
# exposes `Paragraph::line_count` to bound the scroll to the number of lines AFTER
# wrapping (otherwise it is impossible to scroll all the way up when lines wrap).
ratatui = { version = "0.29", features = [
    "unstable-rendered-line-info",
    # `scrolling-regions`: the parity renderer owns an inline viewport and writes
    # finalized history above it. Without DECSTBM the insertion would have to
    # repaint the whole screen on every committed line.
    "scrolling-regions",
] }
crossterm = { version = "0.28", features = ["bracketed-paste"] }
# markdown rendering of the replies (CommonMark + GFM) -> ratatui spans.
pulldown-cmark = { version = "0.12", default-features = false }
unicode-width = "0.2"
unicode-segmentation = "1"
# `wrap_optimal_fit`: paragraph-level line breaking (Knuth-Plass). A greedy wrap
# leaves a ragged right edge and the occasional one-word last line; the optimal
# fit balances the whole paragraph, which is what the transcript is made of.
textwrap = { version = "0.16", default-features = false, features = ["smawk", "unicode-width"] }
# inline diff of the edits (EP-011): lines + intra-line emphasis (word-diff). The
# `inline` feature exposes `iter_inline_changes`; `unicode` aligns the word
# segmentation on graphemes.
similar = { version = "2", features = ["inline", "unicode"] }
# syntax coloring of code blocks and diffs (EP-012, US-040/042). `default-fancy`
# = Sublime grammars/themes embedded through `fancy-regex` (PURE RUST, no C
# toolchain: no oniguruma) -> distributable binary. Coloring NEVER runs per
# frame (US-041 cache). `two-face` fills the grammars missing from syntect (TS,
# TOML, ...) with the curated `bat` set; `syntect-default-fancy` keeps the fancy backend
# (onig out of the dependency tree, checked with `cargo tree`).
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }
landlock = "0.4"
anyhow = "1"
# declarative configuration (US-016): reference TOML parser (toml-rs), replacing
# the in-house text splitting of `parse_tomlish_string`. Read only
# (`toml::Table` + serde): writing the settings stays a line upsert, which
# preserves the comments without pulling `toml_edit` into the graph.
toml = "1"
# Observability (US-020): the libraries EMIT through the facade, the binary alone
# installs a subscriber. `tracing` was already in the graph transitively; the
# subscriber stays minimal on purpose (no ansi in a log file, no env-filter: a
# level is what `PYXIS_LOG` needs).
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
# terminal rendering snapshots (US-005): DEV-ONLY. Declared here for the single
# workspace version, but reserved for `[dev-dependencies]`, never in the
# graph of the distributed `pyxis` binary.
insta = "1"
# MCP (ARCHITECTURE 6): official Rust SDK. stdio (transport-child-process) and
# remote Streamable HTTP (US-013). The `-reqwest` variant of the HTTP transport is
# NOT enabled on purpose: it pins reqwest 0.13 while the workspace is on 0.12,
# which would duplicate the whole HTTP/TLS stack. `agent-mcp` implements the
# `StreamableHttpClient` trait over the workspace client instead. Per-server OAuth
# stays deferred.
rmcp = { version = "1.7.0", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client"] }
# SSE frame decoding of the Streamable HTTP transport. Same crate (and same 0.2
# line) as the one `rmcp` decodes with: the `Sse` type crosses the trait boundary,
# so a second version would not type-check.
sse-stream = "0.2"
# App-server (EP-005). `schemars` derives the JSON Schema of the protocol from
# the Rust types themselves, so the published schema cannot drift from what
# serde really reads (US-018 AC3); the TypeScript is emitted from that schema.
# `tokio-tungstenite` carries the second transport. No TLS feature: the listener
# is loopback-only and refuses anything else, so a TLS stack would add a
# dependency for a perimeter that is already closed.
schemars = "1"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }
# internal crates
agent-tokenizer = { path = "crates/agent-tokenizer" }
agent-mcp = { path = "crates/agent-mcp" }
agent-core = { path = "crates/agent-core" }
agent-app-server = { path = "crates/agent-app-server" }
agent-code-mode = { path = "crates/agent-code-mode" }
agent-code-mode-v8 = { path = "crates/agent-code-mode-v8" }
agent-runtime = { path = "crates/agent-runtime" }
agent-session = { path = "crates/agent-session" }
agent-tools = { path = "crates/agent-tools" }
agent-auth = { path = "crates/agent-auth" }
agent-provider = { path = "crates/agent-provider" }
agent-sandbox = { path = "crates/agent-sandbox" }
agent-tui = { path = "crates/agent-tui" }
